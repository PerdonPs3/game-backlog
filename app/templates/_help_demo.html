{% macro help_demo(key, label, version, seconds=30) -%}
<figure class="help-demo" data-help-demo>
    <video controls muted playsinline preload="none" poster="{{ url_for('static', filename='videos/help-' ~ key ~ '-poster.webp', v=version) }}" data-help-video data-src="{{ url_for('static', filename='videos/help-' ~ key ~ '.mp4', v=version) }}" aria-label="{{ label }}: a {{ seconds }}-second demonstration" width="1920" height="1152">
        <track kind="captions" src="{{ url_for('static', filename='videos/help-' ~ key ~ '.vtt', v=version) }}" srclang="en" label="English">
        Your browser does not support this video. Follow the steps above.
    </video>
    <figcaption><span>{{ seconds }} seconds · No audio</span><button type="button" data-help-replay hidden aria-label="Replay {{ label|lower }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/></svg>Replay</button></figcaption>
</figure>
{%- endmacro %}
