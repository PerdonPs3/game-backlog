{% if accounts_enabled and (game is not defined or game.igdb_id is not none) %}
<div class="review-publication">
    <label><input type="checkbox" name="publish_review" value="yes"{% if request.form.get('publish_review') == 'yes' %} checked{% endif %}{% if not review_publication_available %} disabled{% endif %}>Publish these notes as a public review</label>
    {% if review_publication_available %}
    <div class="review-publication-options">
        <small>Rating and review text are required. Replaces your existing public review for this game, if any.</small>
        <label><input type="checkbox" name="public_review_spoilers" value="yes"{% if (request.form.get('public_review_spoilers') == 'yes' if request.method == 'POST' else public_review_spoilers_default|default(false)) %} checked{% endif %}>Contains spoilers</label>
    </div>
    {% else %}<small><a href="{{ url_for('auth.profile', _anchor='profile-privacy') }}">Make your profile public</a> to publish reviews.</small>{% endif %}
</div>
{% endif %}
