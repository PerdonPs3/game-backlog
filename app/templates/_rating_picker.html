{% macro rating_picker(value='') %}
{% set score = value|int if value else 0 %}
<fieldset class="rating-picker" data-rating-picker>
    <legend>Your rating <span class="rating-optional">Optional</span></legend>
    <div class="rating-stars" aria-label="Rate from half a star to five stars">
    {% for point in range(1, 11) %}
        <label class="rating-choice" title="{{ point / 2 }} stars · {{ point }}/10">
            <input type="radio" name="rating" value="{{ point }}" aria-label="{{ point / 2 }} stars, {{ point }} out of 10"{% if score == point %} checked{% endif %}>
            <svg viewBox="{{ 0 if point % 2 else 12 }} 0 12 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z"/></svg>
        </label>
    {% endfor %}
    </div>
    <div class="rating-caption"><output data-rating-score>{{ (score|string ~ '/10') if score else 'Not rated' }}</output><label class="rating-clear"><input type="radio" name="rating" value="" aria-label="Clear rating"{% if not score %} checked{% endif %}><span>Clear</span></label></div>
</fieldset>
{% endmacro %}
