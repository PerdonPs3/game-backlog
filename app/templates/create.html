<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a game · Game Backlog</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <h1>Add a game</h1>
        <p>Choose your next adventure.</p>
        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div>
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ request.form.get('title', '') }}"
                    maxlength="200"
                    required
                >
            </div>

            <div>
                <label for="platform">Platform</label>
                <input
                    type="text"
                    id="platform"
                    name="platform"
                    value="{{ request.form.get('platform', '') }}"                    
                    maxlength="80"
                    required
                >
            </div>

            <div>
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    {% for status in ('Backlog', 'Playing', 'Completed') %}
                        <option
                            value="{{ status }}"
                            {% if request.form.get('status', 'Backlog') == status %}selected{% endif %}
                        >
                            {{ status }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="rating">Rating (1–10, optional)</label>
                <input
                    type="number"
                    id="rating"
                    name="rating"
                    min="1"
                    max="10"
                    step="1"
                    value="{{ request.form.get('rating', '') }}"
                >
            </div>

            <div>
                <label for="review">Review (optional)</label>
                <textarea
                    id="review"
                    name="review"
                    rows="4"
                    maxlength="2000"
                >{{ request.form.get('review', '') }}</textarea>
            </div>
            <button type="submit">Add game</button>
        </form>

        <a href="{{ url_for('main.index') }}">Back to collection</a>
    </main>
</body>
</html>
