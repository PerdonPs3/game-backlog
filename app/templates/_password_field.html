{% macro password_field(id, label, autocomplete, counter=false) %}
<div class="account-password-field" data-password-field>
    <label for="{{ id }}">{{ label }}</label>
    <div class="account-password-input"><input type="password" id="{{ id }}" name="{{ id }}" autocomplete="{{ autocomplete }}" minlength="8" maxlength="128" required{% if counter %} data-password-count aria-describedby="{{ id }}-count"{% elif id == 'confirmation' %} aria-describedby="confirmation-feedback"{% endif %}><button type="button" data-password-toggle="{{ id }}" aria-controls="{{ id }}" aria-label="Show {{ label|lower }}" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash d="m3 3 18 18" hidden/></svg></button></div>
    {% if counter %}<p class="account-password-hint" id="{{ id }}-count">0 characters · Min. 8 · Max. 128</p>{% elif id == 'confirmation' %}<p class="account-password-hint" id="confirmation-feedback" role="status"></p>{% endif %}
</div>
{% endmacro %}
