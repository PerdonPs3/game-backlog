<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Backlog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <h1>Game Backlog</h1>
        <p>Your next adventure starts here.</p>
        <a class="button-link" href="{{ url_for('main.create') }}">
            + Add game
        </a>        
        <section aria-label="Game collection">
            {% for game in games %}
                <article class="game-card">
                    <h2>{{ game.title }}</h2>
                    <p>Platform: {{ game.platform }}</p>
                    <p>Status: {{ game.status }}</p>
                    <div class="game-actions">
                        <a href="{{ url_for('main.edit', game_id=game['id']) }}">
                            Edit game
                        </a>
                        <a class="danger-link"
                            href="{{ url_for('main.delete', game_id=game['id']) }}">
                            Delete game
                        </a>
                    </div>
                </article>
            {% else %}
                <p>No games yet. Your collection is waiting!</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
