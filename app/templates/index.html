<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Backlog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include '_brand_easter_egg.html' %}
    <main>
        <h1>Game Backlog</h1>
        <p>Your next adventure starts here.</p>
        <a class="button-link" href="{{ url_for('main.create') }}">
            + Add game
        </a> 
        <form id="collection-filters" method="get" action="{{ url_for('main.index') }}">
            <div>
                <label for="title-search">Search your collection</label>
                <input
                    type="search"
                    id="title-search"
                    name="q"
                    value="{{ search_query }}"
                    placeholder="Search by game title..."
                    maxlength="200"
                >
            </div>
            <div>
                <label for="status-filter">Filter by status</label>
                <select id="status-filter" name="status">
                    <option value="" {% if selected_status == '' %}selected{% endif %}>
                        All games
                    </option>
                    {% for status in ('Backlog', 'Playing', 'Completed') %}
                        <option
                            value="{{ status }}"
                            {% if selected_status == status %}selected{% endif %}
                        >
                            {{ status }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button id="apply-filters" type="submit">Apply filters</button>
            <div id="filter-reset">
                {% if search_query or selected_status %}
                    <a href="{{ url_for('main.index') }}">Clear filters</a>
                {% endif %}
            </div>
        </form>
        <p id="filter-message" class="catalog-message" role="status" aria-live="polite"></p>
        <section id="game-collection" aria-label="Game collection" aria-busy="false">
            {% include '_game_collection.html' %}
        </section>
        <p class="catalog-message">Game data and covers provided by
            <a href="https://www.igdb.com/" target="_blank" rel="noopener noreferrer">IGDB</a>.
        </p>
    </main>
    <script src="{{ url_for('static', filename='collection-covers.js') }}" defer></script>
    <script src="{{ url_for('static', filename='collection-filters.js') }}" defer></script>
    <script src="{{ url_for('static', filename='cursor-glow.js') }}" defer></script>
</body>
</html>
