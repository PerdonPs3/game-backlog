{% macro stat_card(label, value, kind, value_id=none, suffix='') %}
<div class="summary-stat">
    <dt><span class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24">{% if kind == 'total' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>{% elif kind == 'completed' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>{% elif kind == 'playing' %}<path d="m9 5 11 7-11 7Z"/>{% elif kind == 'backlog' %}<path d="M6 3h12v18l-6-4-6 4Z"/>{% elif kind == 'completion' %}<circle cx="12" cy="12" r="9" opacity=".35"/><path d="M12 3a9 9 0 0 1 9 9"/>{% endif %}</svg></span>{{ label }}</dt>
    <dd{% if value_id %} id="{{ value_id }}"{% endif %}>{{ value }}{% if suffix %}<small>{{ suffix }}</small>{% endif %}</dd>
</div>
{% endmacro %}
