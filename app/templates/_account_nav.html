<nav class="account-navigation" aria-label="Main navigation">
    {% if account_user or not accounts_enabled %}<a href="{{ url_for('main.index') }}" {% if navigation_group == 'library' %}aria-current="page"{% endif %}>Library</a>{% endif %}
    <a href="{{ url_for('discovery.index') }}" {% if navigation_group == 'discover' %}aria-current="page"{% endif %}>Discover</a>
    {% if accounts_enabled %}<a href="{{ url_for('profiles.search') }}" {% if navigation_group == 'community' %}aria-current="page"{% endif %}>Community</a>
    {% if account_user %}
    <details class="account-menu"><summary aria-label="Your account"><span class="account-menu-avatar" aria-hidden="true">{{ navigation_initial }}</span><span class="account-menu-label">Account</span><span aria-hidden="true">⌄</span></summary><div class="account-menu-panel">
        <a href="{{ profile_url() }}">My profile</a><a href="{{ url_for('auth.profile') }}">Settings</a><a href="{{ url_for('navigation.data') }}">Data &amp; backups</a>
        <form action="{{ url_for('auth.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Sign out</button></form>
    </div></details>
    {% else %}<a href="{{ url_for('auth.login') }}">Sign in</a><a class="account-create" href="{{ url_for('auth.register') }}">Create account</a>{% endif %}{% endif %}
</nav>
