<nav class="account-navigation" aria-label="Main navigation">
    {% if account_user or not accounts_enabled %}<a href="{{ url_for('main.index') }}" {% if navigation_group == 'library' %}aria-current="page"{% endif %}><svg class="navigation-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v15M3 4.5c3-1 6-.5 9 1.5 3-2 6-2.5 9-1.5v14c-3-1-6-.5-9 1.5-3-2-6-2.5-9-1.5z"/></svg><span>Library</span></a>{% endif %}
    <a href="{{ url_for('discovery.index') }}" {% if navigation_group == 'discover' %}aria-current="page"{% endif %}><svg class="navigation-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Discover</span></a>
    {% if accounts_enabled %}<a href="{{ url_for('profiles.search') }}" {% if navigation_group == 'community' %}aria-current="page"{% endif %}><svg class="navigation-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 20v-2a6 6 0 0 0-3-5.2"/></svg><span>Community</span></a>
    {% if account_user %}
    <details class="account-menu"><summary aria-label="Your account"><span class="account-menu-avatar" aria-hidden="true">{% if navigation_photo_url %}<img src="{{ navigation_photo_url }}" width="30" height="30" alt="">{% else %}{{ navigation_initial }}{% endif %}</span><span class="account-menu-label">Account</span><svg class="account-menu-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="account-menu-panel">
        <a href="{{ profile_url() }}">My profile</a><a href="{{ url_for('auth.profile') }}">Settings</a><a href="{{ url_for('navigation.data') }}">Data &amp; backups</a>
        <form action="{{ url_for('auth.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Sign out</button></form>
    </div></details>
    {% else %}<a href="{{ url_for('auth.login') }}">Sign in</a><a class="account-create" href="{{ url_for('auth.register') }}">Create account</a>{% endif %}{% endif %}
</nav>
