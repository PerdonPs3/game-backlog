<fieldset class="play-dates">
    <legend>Play history (optional)</legend>
    <div>
        <label for="started-on">Started on</label>
        <input type="date" id="started-on" name="started_on"
               value="{{ request.form.get('started_on', (game['started_on'] or '') if game is defined else '') }}">
    </div>
    <div>
        <label for="completed-on">Completed on</label>
        <input type="date" id="completed-on" name="completed_on"
               value="{{ request.form.get('completed_on', (game['completed_on'] or '') if game is defined else '') }}">
    </div>
    <p>Enter the dates you remember. Leave them empty if you are not sure.</p>
</fieldset>
