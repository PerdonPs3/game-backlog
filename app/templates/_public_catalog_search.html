<form class="catalog-public-search" data-catalog-url="{{ url_for('explore.suggestions') }}" data-browse-url="{{ url_for('explore.game', catalog_id=0) }}" method="get" action="{{ url_for('explore.index') }}" role="search">
    <label for="catalog-query">Search games</label><div><div class="catalog-input-wrapper"><input id="catalog-query" type="search" name="q" value="{{ query|default('') }}" minlength="2" maxlength="200" required placeholder="A title, a series, a world to return to…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="catalog-results" aria-describedby="catalog-message"><div id="catalog-results" class="catalog-results" role="listbox" aria-label="Matching games" hidden></div></div><button type="submit">Search ↗</button></div><p><span id="catalog-message" role="status">Type at least 2 characters.</span> <a href="{{ url_for('explore.index') }}">Clear search</a></p>
</form>
