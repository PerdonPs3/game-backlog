<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit game · Game Backlog</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include '_brand_easter_egg.html' %}
    <main>
        <h1>Edit game</h1>
        <p>Update your game details.</p>

        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ request.form.get('title', game['title']) }}"
                    maxlength="200"
                    {% if game['igdb_id'] is not none %}readonly{% endif %}
                    required
                >
            </div>

            <div>
                <label for="platform">Platform</label>
                {% if game['igdb_id'] is not none %}
                <select id="platform" name="platform" required>
                    <option value="">Choose a platform</option>
                    {% for platform in available_platforms %}
                        <option value="{{ platform }}" {% if request.form.get('platform', game['platform']) == platform %}selected{% endif %}>
                            {{ platform }}
                        </option>
                    {% endfor %}
                </select>
                {% else %}
                <input
                    type="text"
                    id="platform"
                    name="platform"
                    value="{{ request.form.get('platform', game['platform']) }}"
                    maxlength="80"
                    required
                >
                {% endif %}
            </div>

            <div>
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    {% for status in ('Backlog', 'Playing', 'Completed') %}
                        <option
                            value="{{ status }}"
                            {% if request.form.get('status', game['status']) == status %}selected{% endif %}
                        >
                            {{ status }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="rating">Rating (1–10, optional)</label>
                <input
                    type="number"
                    id="rating"
                    name="rating"
                    min="1"
                    max="10"
                    step="1"
                    value="{{ request.form.get('rating', game['rating'] if game['rating'] is not none else '') }}"
                >
            </div>

            <div>
                <label for="review">Review (optional)</label>
                <textarea
                    id="review"
                    name="review"
                    rows="4"
                    maxlength="2000"
                >{{ request.form.get('review', game['review']) }}</textarea>
            </div>

            <button type="submit">Save changes</button>
        </form>

        <a href="{{ url_for('main.index') }}">Back to collection</a>
    </main>
    <script src="{{ url_for('static', filename='cursor-glow.js') }}" defer></script>
</body>
</html>
